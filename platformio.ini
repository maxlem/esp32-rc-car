[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bluepad32-enabled Arduino-ESP32 core for Bluetooth gamepad support
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

[env:esp32dev-ble]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCONTROL_BLE
